<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brennt, rußt, fließt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#EDF0F1; --surface:#FFFFFF; --surface-2:#F4F6F7; --stage:#F8FAFA;
  --ink:#1A2026; --muted:#56626D; --line:#D6DDE1; --line-strong:#AEB9C0;
  --flame:#C4420D; --flame-ink:#A8380B; --flame-soft:#FBE6DA;
  --oil:#8F5E07; --oil-ink:#7A5006; --oil-fill:#D9A032; --oil-soft:#F6EBD2;
  --cu:#1C62C4; --cu-ink:#17529F; --cu-soft:#DDE8F8;
  --aqua:#0B7285; --aqua-ink:#085A69; --aqua-soft:#DCF1F4;
  --ok:#23804A; --ok-ink:#17603A; --ok-soft:#DCF1E3;
  --bad:#B8322A; --bad-ink:#8E2019; --bad-soft:#F8E1DF;
  --on-accent:#FFFFFF; --soot:#2A2E33; --scrim:rgba(12,16,20,.55);
  --accent:var(--flame); --accent-ink:var(--flame-ink); --accent-soft:var(--flame-soft);
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101316; --surface:#191E23; --surface-2:#1F252B; --stage:#141A1F;
    --ink:#E7ECEF; --muted:#9CA8B2; --line:#2C343B; --line-strong:#46515B;
    --flame:#FF8A4C; --flame-ink:#FFA372; --flame-soft:#3A2418;
    --oil:#E7B24A; --oil-ink:#F0C46C; --oil-fill:#C58B1E; --oil-soft:#352A14;
    --cu:#6AA8FF; --cu-ink:#8DBBFF; --cu-soft:#1A2A43;
    --aqua:#4FC3D6; --aqua-ink:#7AD3E2; --aqua-soft:#12323A;
    --ok:#5BCB87; --ok-ink:#8FE3B0; --ok-soft:#163323;
    --bad:#FF7A70; --bad-ink:#FFB0A8; --bad-soft:#3B1D1B;
    --on-accent:#14100D; --soot:#0A0C0E; --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101316; --surface:#191E23; --surface-2:#1F252B; --stage:#141A1F;
  --ink:#E7ECEF; --muted:#9CA8B2; --line:#2C343B; --line-strong:#46515B;
  --flame:#FF8A4C; --flame-ink:#FFA372; --flame-soft:#3A2418;
  --oil:#E7B24A; --oil-ink:#F0C46C; --oil-fill:#C58B1E; --oil-soft:#352A14;
  --cu:#6AA8FF; --cu-ink:#8DBBFF; --cu-soft:#1A2A43;
  --aqua:#4FC3D6; --aqua-ink:#7AD3E2; --aqua-soft:#12323A;
  --ok:#5BCB87; --ok-ink:#8FE3B0; --ok-soft:#163323;
  --bad:#FF7A70; --bad-ink:#FFB0A8; --bad-soft:#3B1D1B;
  --on-accent:#14100D; --soot:#0A0C0E; --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}
body[data-etappe="e2"], .et-card[data-c="e2"]{--accent:var(--oil); --accent-ink:var(--oil-ink); --accent-soft:var(--oil-soft)}
body[data-etappe="e3"], .et-card[data-c="e3"]{--accent:var(--cu); --accent-ink:var(--cu-ink); --accent-soft:var(--cu-soft)}
body[data-etappe="e4"], .et-card[data-c="e4"]{--accent:var(--aqua); --accent-ink:var(--aqua-ink); --accent-soft:var(--aqua-soft)}
.et-card[data-c="e1"]{--accent:var(--flame); --accent-ink:var(--flame-ink); --accent-soft:var(--flame-soft)}

*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font:400 17px/1.55 var(--font-body); -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display); line-height:1.15; margin:0; text-wrap:balance; letter-spacing:-.01em}
h3{font-size:1.12rem; font-weight:700}
p{margin:0}
a{color:var(--accent-ink)}
sub{font-size:.72em; line-height:0}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--cu); outline-offset:2px}
.small{font-size:.9rem}
.muted{color:var(--muted)}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.stack{display:grid; gap:12px}
.grow{flex:1; min-width:0}
.ic{flex:none; vertical-align:middle}
.f{font-weight:400; color:var(--muted); font-size:.9em}

/* Kopfleiste */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--bg); border-bottom:1px solid var(--line)}
@supports (backdrop-filter:blur(8px)){ .topbar{background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)} }
.topbar-in{max-width:980px; margin:0 auto; padding:8px 16px; display:flex; align-items:center; gap:10px; min-height:60px}
.iconbtn{min-width:44px; min-height:44px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:0 12px; font-weight:700; cursor:pointer}
.tb-title{flex:1; min-width:0}
.tb-title small{display:block; color:var(--muted); font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.09em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tb-title strong{display:block; font-family:var(--font-display); font-size:1.08rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.progress{height:4px; background:var(--line)}
.progress i{display:block; height:100%; width:0; background:var(--accent); transition:width .45s ease}
@media (max-width:520px){ .hide-sm{display:none} }

main{padding-block:22px 128px}
.wrap{max-width:780px; margin:0 auto; padding-inline:16px}
.wrap.wide{max-width:980px}

/* Schritt */
.step{display:grid; gap:18px}
.eyebrow{font:700 .76rem/1.2 var(--font-body); letter-spacing:.11em; text-transform:uppercase; color:var(--accent-ink)}
.step-title{font-size:clamp(1.6rem, 4.2vw, 2.15rem); font-weight:800}
.lead{font-size:1.12rem}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; display:grid; gap:12px}
.info{background:var(--surface-2); border-radius:var(--r); padding:16px 18px; display:grid; gap:8px}
.info ul, .card ul{margin:0; padding-left:1.2em; display:grid; gap:4px}
.task{border:2px solid var(--accent); border-radius:var(--r); padding:14px 18px 16px; background:var(--surface); display:grid; gap:6px}
.task-tag{justify-self:start; font:700 .7rem/1 var(--font-body); letter-spacing:.12em; text-transform:uppercase; background:var(--accent); color:var(--on-accent); padding:5px 8px; border-radius:6px}
.task b{color:var(--accent-ink)}
.nb{font-size:.92rem; color:var(--muted); display:flex; gap:8px; align-items:flex-start}
.partner{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:14px; border:1.5px dashed var(--line-strong)}
.two{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px}
.big-q{font-family:var(--font-display); font-size:clamp(1.25rem, 3.4vw, 1.55rem); font-weight:700; line-height:1.25}

/* Bedienelemente */
.btn{min-height:48px; padding:11px 20px; border-radius:12px; border:0; background:var(--accent); color:var(--on-accent); font-weight:700; font-size:1rem; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; transition:transform .12s, opacity .2s}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line-strong)}
.btn.sm{min-height:44px; padding:8px 14px; font-size:.95rem}
.btn[disabled]{opacity:.42; cursor:not-allowed}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{min-height:44px; padding:8px 14px; border-radius:999px; border:1.5px solid var(--line-strong); background:var(--surface); font-weight:600; font-size:.97rem; cursor:pointer; display:inline-flex; align-items:center; gap:6px; text-align:left}
.chip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); font-weight:700}
.chip[aria-pressed="true"]::before{content:"✓"; color:var(--accent-ink); font-weight:700}
.chip.ok{border-color:var(--ok); background:var(--ok-soft)}
.chip.bad{border-color:var(--bad); background:var(--bad-soft)}
.chip[disabled]{opacity:.45; cursor:not-allowed}
.ts{font:600 .84rem var(--font-mono); color:var(--accent-ink)}
.field{display:grid; gap:6px}
.field-label{font-weight:700}
textarea{width:100%; min-height:130px; border-radius:12px; border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink); font:inherit; padding:12px 14px; resize:vertical}
textarea:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft)}
input[type=range]{width:100%; height:44px; accent-color:var(--accent); background:transparent}
.fb{border-radius:12px; padding:11px 14px; font-weight:600}
.fb.inline{padding:8px 12px}
.fb.ok{background:var(--ok-soft); color:var(--ok-ink)}
.fb.bad{background:var(--bad-soft); color:var(--bad-ink)}
.fb.neutral{background:var(--surface-2); color:var(--ink); font-weight:400}

/* Reihenfolge */
.order{display:grid; gap:8px}
.order-ends{display:flex; justify-content:space-between; gap:12px; font-size:.86rem; color:var(--muted); font-weight:700}
.order-item{display:flex; align-items:center; gap:12px; width:100%; min-height:58px; padding:10px 14px; border:1.5px solid var(--line-strong); border-radius:14px; background:var(--surface); cursor:pointer; text-align:left}
.order-item .rank{width:36px; height:36px; border-radius:50%; border:2px dashed var(--line-strong); display:grid; place-items:center; font:600 1rem var(--font-mono); flex:none}
.order-item.ranked{border-color:var(--accent); background:var(--accent-soft)}
.order-item.ranked .rank{border:0; background:var(--accent); color:var(--on-accent)}
.oi-main{display:grid}
.oi-main small{color:var(--muted); font-size:.88rem}
.row-end{display:flex; justify-content:flex-end}

/* Auswahlfragen */
.mc{display:grid; gap:8px}
.mc-q{font-weight:700; font-size:1.05rem}
.opt{display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%; min-height:54px; padding:12px 14px; border-radius:14px; border:1.5px solid var(--line-strong); background:var(--surface); cursor:pointer}
.opt .mark{width:22px; height:22px; border-radius:50%; border:2px solid var(--line-strong); flex:none; margin-top:2px}
.mc.multi .opt .mark{border-radius:6px}
.opt[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.opt[aria-pressed="true"] .mark{background:var(--accent); border-color:var(--accent); box-shadow:inset 0 0 0 3px var(--surface)}
.opt.ok{border-color:var(--ok); background:var(--ok-soft)}
.opt.bad{border-color:var(--bad); background:var(--bad-soft)}
.opt.correct-show{border-color:var(--ok); border-style:dashed}
.opt[disabled]{cursor:default}
.opt-fb{display:block; margin-top:5px; font-size:.93rem; font-weight:600}
.opt.ok .opt-fb{color:var(--ok-ink)} .opt.bad .opt-fb{color:var(--bad-ink)}

/* Lückensätze */
.blanks{font-size:1.1rem; line-height:2.5}
.blanks select{min-height:44px; font:inherit; font-size:1rem; font-weight:700; border-radius:10px; border:1.5px solid var(--accent); background:var(--accent-soft); color:var(--ink); padding:4px 8px; margin:0 2px; max-width:100%}
.blanks select.ok{border-color:var(--ok); background:var(--ok-soft)}
.blanks select.bad{border-color:var(--bad); background:var(--bad-soft)}
.blanks-box{display:grid; gap:8px}

/* Lernhilfen */
.hints{border:1.5px dashed var(--line-strong); border-radius:var(--r); padding:14px 16px; display:grid; gap:10px}
.hints-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap}
.hint{background:var(--surface-2); border-radius:12px; padding:12px 14px; display:grid; gap:8px; justify-items:start}
.hint-k{font:700 .72rem var(--font-body); letter-spacing:.1em; text-transform:uppercase; color:var(--accent-ink)}
.hint-a{padding-top:8px; border-top:1px solid var(--line); width:100%}
.hint-a.sol{border-top:0; padding-top:0}

/* Selbstcheck */
.checks{display:grid; gap:8px}
.check{display:flex; gap:12px; align-items:center; width:100%; min-height:48px; padding:8px 12px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); text-align:left; cursor:pointer}
.check .box{width:22px; height:22px; border-radius:6px; border:2px solid var(--line-strong); flex:none; display:grid; place-items:center}
.check.on{border-color:var(--ok); background:var(--ok-soft)}
.check.on .box{background:var(--ok); border-color:var(--ok)}
.check.on .box::after{content:"✓"; color:var(--surface); font-weight:700; font-size:.85rem}
.solution{background:var(--surface-2); border-radius:12px; padding:12px 14px}

/* Barometer */
.baro{display:grid; gap:16px}
.baro-row{display:grid; gap:8px}
.scale{display:grid; grid-template-columns:repeat(4, 1fr); gap:6px}
.scale button{min-height:46px; border-radius:10px; border:1.5px solid var(--line-strong); background:var(--surface); font-weight:600; font-size:.88rem; cursor:pointer; padding:4px}
.scale button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.growth{font-size:.92rem; color:var(--muted)}
.growth .up{display:inline-block; margin-left:6px; padding:1px 8px; border-radius:999px; background:var(--ok-soft); color:var(--ok-ink); font:600 .8rem var(--font-mono)}

/* Tabellen, Diagramme */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:.96rem}
.tbl th,.tbl td{padding:9px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top}
.tbl th{font-size:.74rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted)}
.tbl td.num{font-family:var(--font-mono); white-space:nowrap}
.yes{color:var(--ok-ink); font-weight:700} .no{color:var(--bad-ink); font-weight:700}
.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block; width:100%; min-width:420px; height:auto}
.c-axis{stroke:var(--line-strong)} .c-grid{stroke:var(--line)} .c-txt{fill:var(--muted); font:500 12px var(--font-mono)} .c-lbl{fill:var(--ink); font:700 13px var(--font-body)}
.c-bar{fill:var(--oil-fill)} .c-val{fill:var(--ink); font:600 12px var(--font-mono)} .c-ref{stroke:var(--cu); stroke-dasharray:6 5; stroke-width:2} .c-ref-t{fill:var(--cu-ink); font:700 12px var(--font-body)}

/* Simulationen */
.sim{background:var(--surface); border:1px solid var(--line); border-radius:18px; overflow:hidden}
.sim-head{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px 10px 16px; border-bottom:1px solid var(--line)}
.sim-head strong{font-family:var(--font-display)}
.sim-stage{position:relative; background:var(--stage)}
.sim-stage canvas{display:block; width:100%}
.sim-ctrl{padding:14px 16px 16px; display:grid; gap:14px; border-top:1px solid var(--line)}
.ctrl{display:flex; gap:12px; align-items:flex-start}
.ctrl-label{font-weight:700; margin-bottom:6px}
.nr{width:28px; height:28px; border-radius:50%; background:var(--ink); color:var(--surface); font:600 .86rem var(--font-mono); display:inline-grid; place-items:center; flex:none; margin-top:8px}
.status{font-weight:700}
.status.ok{color:var(--ok-ink)} .status.bad{color:var(--bad-ink)}
.readout{display:flex; flex-wrap:wrap; gap:6px 18px; font-size:.93rem; color:var(--muted)}
.readout b{color:var(--ink); font-family:var(--font-mono); font-weight:600}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; padding:8px 16px; font-size:.85rem; color:var(--muted); border-top:1px solid var(--line)}
.dot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px}

/* Nachweis-Apparatur */
.app-svg{display:block; width:100%; height:auto}
.app-glass{fill:none; stroke:var(--line-strong); stroke-width:2}
.app-lbl{fill:var(--muted); font:700 13px var(--font-body)}
.flow{fill:none; stroke-width:3; stroke-dasharray:3 9; stroke-linecap:round; opacity:0; transition:opacity .4s}
.flow.on{opacity:.9; animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.nw-flame{transform-origin:110px 205px; animation:flick .18s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1)} to{transform:scale(.94,1.06)}}

/* Viskosimeter */
.shelf{display:flex; flex-wrap:wrap; gap:8px}
.visco{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; padding:16px 10px 12px}
.tube-col{display:grid; justify-items:center; gap:8px}
.tube-lbl{min-height:48px; width:100%; border-radius:10px; border:1.5px dashed var(--line-strong); background:var(--surface); font-weight:700; font-size:.88rem; line-height:1.15; cursor:pointer; padding:4px}
.tube-lbl.filled{border-style:solid; border-color:var(--accent); background:var(--accent-soft)}
.tube{position:relative; width:48px; height:250px; border:2px solid var(--line-strong); border-top:0; border-radius:0 0 26px 26px; overflow:hidden; background:transparent}
.tube.filled{background:linear-gradient(90deg, rgba(255,255,255,0) 18%, rgba(255,255,255,.45) 32%, rgba(255,255,255,0) 50%), color-mix(in srgb, var(--cu) 9%, transparent)}
.tube.filled::before{content:""; position:absolute; left:0; right:0; top:6px; border-top:2px solid color-mix(in srgb, var(--cu) 30%, transparent)}
.ball{position:absolute; left:50%; top:10px; width:18px; height:18px; margin-left:-9px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #FFFFFF, #A4AEB6 45%, #39424A); box-shadow:0 1px 2px rgba(0,0,0,.35)}
.watch{font:600 1rem var(--font-mono); min-height:1.5em}
@media (max-width:480px){ .tube{height:200px; width:40px} }

/* Gleichungs-Werkstatt */
.eq{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px 12px; font-size:1.3rem; font-weight:700; padding:16px 10px}
.term{display:inline-block; white-space:nowrap}
.stepper{display:inline-flex; align-items:center; border:1.5px solid var(--line-strong); border-radius:12px; overflow:hidden; background:var(--surface)}
.stepper button{width:40px; height:46px; border:0; background:var(--surface-2); font-size:1.25rem; font-weight:700; cursor:pointer}
.stepper output{min-width:36px; text-align:center; font:600 1.15rem var(--font-mono)}
.arrow{font-size:1.5rem; color:var(--muted)}
.bal{display:grid; gap:12px}
.bal-el{display:grid; grid-template-columns:34px 1fr 30px; gap:10px; align-items:center}
.el{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font:700 .9rem var(--font-body)}
.el.C{background:#2A2E33; color:#fff} .el.H{background:#F3F5F6; color:#1A2026; border:1.5px solid #AEB9C0} .el.O{background:#D2362B; color:#fff}
.bars{display:grid; gap:4px}
.bar{display:flex; align-items:center; gap:8px; font-size:.84rem; color:var(--muted)}
.bar i{display:block; height:12px; border-radius:6px; background:var(--line-strong); min-width:2px; transition:width .25s}
.bar.l i{background:var(--accent)}
.bar span{font-family:var(--font-mono); color:var(--ink); min-width:1.6em}
.bar em{font-style:normal; width:64px; flex:none}
.state{font-weight:700; text-align:center}
.state.ok{color:var(--ok-ink)} .state.bad{color:var(--bad-ink)}
.waage{display:block; width:220px; max-width:100%; height:auto; margin:0 auto}

/* Video */
.video{position:relative; margin:0; border-radius:var(--r); overflow:hidden; background:#000; aspect-ratio:16/9; max-width:100%}
.video video{display:block; width:100%; height:100%; object-fit:contain; background:#000}
.video-fallback{position:absolute; inset:0; display:grid; place-content:center; gap:12px; text-align:center; padding:16px; background:var(--surface); color:var(--ink)}
.video-tools{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.yt-link{display:inline-flex; gap:6px; align-items:center; min-height:44px; font-weight:700; margin-left:auto}

/* Meilensteine */
.badges{display:flex; flex-wrap:wrap; gap:8px}
.badge{display:inline-flex; align-items:center; gap:10px; padding:6px 14px 6px 6px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); font-weight:700; font-size:.92rem}
.medal{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent-ink); flex:none}

      const th = tip.offsetHeight, tw = tip.offsetWidth;

/* ============ Gleichungs-Werkstatt ============ */
const EQS = [
  { k: "methan", name: "Methan", n: 1, lvl: 1 }, { k: "propan", name: "Propan", n: 3, lvl: 1 },
  { k: "pentan", name: "Pentan", n: 5, lvl: 2 }, { k: "hexan", name: "Hexan", n: 6, lvl: 2 }, { k: "octan", name: "Octan", n: 8, lvl: 3 }
];
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const nAt = (n, el) => n === 1 ? `steht 1 ${el}-Atom` : `stehen ${n} ${el}-Atome`;
const fmtNum = x => Number.isInteger(x) ? String(x) : dec(x, 1);
function Waage(L, R, ok) {
  const ang = -clamp((L - R) * 1.2, -14, 14) * Math.PI / 180, cx = 110, cy = 34, arm = 86;
  const xl = cx - arm * Math.cos(ang), yl = cy - arm * Math.sin(ang), xr = cx + arm * Math.cos(ang), yr = cy + arm * Math.sin(ang);
  const f = v => v.toFixed(1);
  const pan = (x, y, l) => `<line x1="${f(x)}" y1="${f(y)}" x2="${f(x - 18)}" y2="${f(y + 28)}" class="w-str"/><line x1="${f(x)}" y1="${f(y)}" x2="${f(x + 18)}" y2="${f(y + 28)}" class="w-str"/><path d="M${f(x - 24)} ${f(y + 28)} Q${f(x)} ${f(y + 44)} ${f(x + 24)} ${f(y + 28)} Z" class="w-pan"/><text x="${f(x)}" y="${f(y + 60)}" class="w-t">${l}</text>`;
  return `<svg class="waage" viewBox="0 0 220 128" role="img" aria-label="Waage der Atome: ${ok ? "im Gleichgewicht" : "nicht im Gleichgewicht"}"><path d="M${cx} ${cy} L${cx - 14} 124 H${cx + 14} Z" class="w-post"/><line x1="${xl.toFixed(1)}" y1="${yl.toFixed(1)}" x2="${xr.toFixed(1)}" y2="${yr.toFixed(1)}" class="w-beam ${ok ? "ok" : ""}"/><circle cx="${cx}" cy="${cy}" r="5" class="w-post"/>${pan(xl, yl, "Edukte")}${pan(xr, yr, "Produkte")}</svg>`;
}
function Werkstatt() {
  const id = uid();
  const cur = () => get("eq-cur", "pentan");
  const coef = k => get("eq-c-" + k, [1, 1, 1, 1]);
  const St = (i, v) => `<span class="stepper" role="group" aria-label="Vorfaktor"><button type="button" data-d="${i}" data-s="-1" aria-label="Vorfaktor verkleinern">−</button><output>${v}</output><button type="button" data-d="${i}" data-s="1" aria-label="Vorfaktor vergrößern">+</button></span>`;
  const draw = () => {
    const k = cur(), E = EQS.find(e => e.k === k), [a, b, c, d] = coef(k), n = E.n, solved = get("eq-solved", {});
    const L = { C: a * n, H: a * (2 * n + 2), O: 2 * b }, R = { C: c, H: 2 * d, O: 2 * c + d };
    const bal = ["C", "H", "O"].every(x => L[x] === R[x]), g = gcd(gcd(a, b), gcd(c, d));
    const mx = Math.max(4, ...Object.values(L), ...Object.values(R));
    let fb;
    if (bal && g === 1) fb = `<p class="fb ok">Ausgeglichen! ${a === 1 ? `Ein ${E.name}-Molekül reagiert` : `${a} ${E.name}-Moleküle reagieren`} mit ${b} Sauerstoff-Molekülen. Pro ${E.name}-Molekül sind das <b>${fmtNum(b / a)} O₂-Moleküle</b>. Stoffmengenverhältnis: n(${E.name}) : n(O₂) = ${a} : ${b}.</p>`;
    else if (bal) fb = `<p class="fb neutral">Alle Atome stimmen! Aber alle Vorfaktoren lassen sich noch durch ${g} teilen. In Reaktionsgleichungen nimmt man die kleinsten ganzen Zahlen.</p>`;
    else if (L.C !== R.C) fb = `<p class="fb neutral">Beginne mit dem Kohlenstoff: Links ${nAt(L.C, "C")}. Jedes CO₂-Molekül nimmt genau ein C-Atom auf.</p>`;
    else if (L.H !== R.H) fb = `<p class="fb neutral">Jetzt der Wasserstoff: Links ${nAt(L.H, "H")}. Jedes H₂O-Molekül enthält zwei davon.</p>`;
    else fb = R.O % 2 ? `<p class="fb neutral">Rechts stehen ${R.O} O-Atome – eine ungerade Zahl. Ein O₂-Molekül liefert aber immer 2 O-Atome. Verdopple deshalb <b>alle</b> Vorfaktoren, auch den vor dem Alkan.</p>` : `<p class="fb neutral">Zum Schluss der Sauerstoff: Rechts stehen ${R.O} O-Atome. Wie viele O₂-Moleküle liefern genau so viele?</p>`;
    const row = x => `<div class="bal-el"><span class="el ${x}">${x}</span><div class="bars"><div class="bar l"><em>Edukte</em><i style="width:${L[x] / mx * 100}%"></i><span>${L[x]}</span></div><div class="bar"><em>Produkte</em><i style="width:${R[x] / mx * 100}%"></i><span>${R[x]}</span></div></div><span class="state ${L[x] === R[x] ? "ok" : "bad"}" aria-label="${L[x] === R[x] ? "gleich" : "ungleich"}">${L[x] === R[x] ? "✓" : "≠"}</span></div>`;
    return `<div class="stack"><p class="ctrl-label">Wähle ein Alkan <span class="muted small">(★ Einstieg · ★★ mittel · ★★★ Profi)</span></p><div class="chips">${EQS.map(e => `<button type="button" class="chip" data-pick="${e.k}" aria-pressed="${e.k === k}">${e.name} <span class="f">${"★".repeat(e.lvl)}</span>${solved[e.k] ? ` <span class="yes">gelöst</span>` : ""}</button>`).join("")}</div></div>
      <div class="eq" aria-live="polite">${St(0, a)}<span class="term">${fAlk(n)}</span><span>+</span>${St(1, b)}<span class="term">O<sub>2</sub></span><span class="arrow">→</span>${St(2, c)}<span class="term">CO<sub>2</sub></span><span>+</span>${St(3, d)}<span class="term">H<sub>2</sub>O</span></div>
      <div class="two"><div class="bal">${["C", "H", "O"].map(row).join("")}</div><div>${Waage(L.C + L.H + L.O, R.C + R.H + R.O, bal)}</div></div>${fb}`;
  };
  onMount(() => {
    const el = document.getElementById(id); if (!el) return;
    el.addEventListener("click", e => {
      const p = e.target.closest("[data-pick]");
      if (p) { set("eq-cur", p.dataset.pick); el.innerHTML = draw(); return; }
      const b = e.target.closest("[data-d]"); if (!b) return;
      const k = cur(), cf = [...coef(k)]; const i = +b.dataset.d; cf[i] = clamp(cf[i] + (+b.dataset.s), 1, 40);
      set("eq-c-" + k, cf);
      const E = EQS.find(x => x.k === k), [a, bb, c, d] = cf, n = E.n;
      if (a * n === c && a * (2 * n + 2) === 2 * d && 2 * bb === 2 * c + d && gcd(gcd(a, bb), gcd(c, d)) === 1) { const s = { ...get("eq-solved", {}) }; s[k] = cf; set("eq-solved", s); }
      el.innerHTML = draw();
    });
  });
  return `<div class="sim"><div class="sim-head"><strong>Gleichungs-Werkstatt</strong></div><div class="sim-ctrl" id="${id}" style="border-top:0">${draw()}</div></div>`;
}

/* ============ Simulation 4: Teilchen-Lupe Viskosität ============ */
function ChainLens() {
  const id = uid();
  const opts = [{ n: 5, l: "Pentan (C₅)", k: "Pentan" }, { n: 10, l: "Decan (C₁₀)", k: "Decan" }, { n: 16, l: "Hexadecan (C₁₆)", k: "Hexadecan" }];
  const n0 = get("lens-n", 5);
  onMount(() => {
    const root = document.getElementById(id); if (!root) return;
    const cv = $("canvas", root), stage = $(".sim-stage", root), out = $("[data-out]", root), dropBtn = $("[data-drop]", root);
    let G = setupCanvas(cv, 300), n = get("lens-n", 5), chains = [], ball = null, cpm = null, acc = 0;
    const init = () => { const beads = Math.round(G.w * G.h / 700), cnt = Math.max(6, Math.round(beads / n)); chains = Array.from({ length: cnt }, () => ({ x: Math.random() * G.w, y: Math.random() * G.h, a: Math.random() * Math.PI, b: (Math.random() - .5) * .6, vx: 0, vy: 0, va: 0, p: [] })); cpm = null; ball = null; };
    const show = () => {
      const t = get("lens-times", {});
      out.innerHTML = `<span>Van-der-Waals-Kontakte pro Molekül: <b>${cpm == null ? "–" : dec(cpm, 1)}</b></span><span>Fallzeit im Modell: ${opts.map(o => `${o.k} <b>${t[o.n] != null ? dec(t[o.n], 1) + " s" : "–"}</b>`).join(" · ")}</span>`;
    };
    init(); show();
    $("[data-opts]", root).addEventListener("click", e => { const b = e.target.closest("[data-n]"); if (!b) return; n = +b.dataset.n; set("lens-n", n); $$("[data-n]", root).forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.n === n))); init(); show(); });
    dropBtn.addEventListener("click", () => { ball = { y: -14, t: 0 }; });
    $("[data-help]", root).addEventListener("click", () => coach([
      { el: $("[data-opts]", root), text: "Wähle die Kettenlänge. Gezeigt ist nur das Kohlenstoff-Gerüst der Moleküle – die H-Atome sind weggelassen." },
      { el: cv, text: "Die gestrichelten Linien markieren Stellen, an denen sich zwei Moleküle nahe kommen: Dort wirken Van-der-Waals-Kräfte." },
      { el: dropBtn, text: "Lass eine Kugel durch die Flüssigkeit sinken und vergleiche die Fallzeiten für verschiedene Kettenlängen." }
    ]));
    onResize(stage, () => { G = setupCanvas(cv, 300); init(); });
    loop((dt) => {
      const ctx = G.ctx, W = G.w, H = G.h, sp = 9, L = (n - 1) * sp, vmax = 34 / Math.sqrt(n), amax = 1.4 / n, R = Math.random;
      ctx.clearRect(0, 0, W, H);
      chains.forEach(c => {
        c.vx += (R() - .5) * 120 * dt; c.vy += (R() - .5) * 120 * dt; c.va += (R() - .5) * 6 * dt / n;
        c.vx *= .94; c.vy *= .94; c.va *= .94;
        const s = Math.hypot(c.vx, c.vy); if (s > vmax) { c.vx *= vmax / s; c.vy *= vmax / s; }
        c.va = clamp(c.va, -amax, amax); c.x += c.vx * dt; c.y += c.vy * dt; c.a += c.va * dt; c.b = clamp(c.b + (R() - .5) * dt * .8, -.35, .35);
        const mg = L / 2 + 10; if (c.x < -mg) c.x += W + 2 * mg; if (c.x > W + mg) c.x -= W + 2 * mg; if (c.y < -mg) c.y += H + 2 * mg; if (c.y > H + mg) c.y -= H + 2 * mg;
      });
      const pts = [];
      chains.forEach((c, ci) => { const ca = Math.cos(c.a), sa = Math.sin(c.a); c.p = []; for (let j = 0; j < n; j++) { const s = j * sp - L / 2, z = (j % 2 ? 1 : -1) * 2.6 + (L ? c.b * s * s / L : 0); const x = c.x + ca * s - sa * z, y = c.y + sa * s + ca * z; c.p.push([x, y]); pts.push([x, y, ci]); } });
      if (ball) {
        const bx = W / 2, rr = 19;
        chains.forEach(c => { let best = null, bd = 1e9; c.p.forEach(p => { const d = Math.hypot(p[0] - bx, p[1] - ball.y); if (d < bd) { bd = d; best = p; } }); if (bd < rr && bd > 0.01) { const f = (rr - bd) * 0.5; c.x += (best[0] - bx) / bd * f; c.y += (best[1] - ball.y) / bd * f; } });
      }
      const cell = 15, grid = new Map();
      pts.forEach((p, i) => { const k = ((p[0] / cell) | 0) + "," + ((p[1] / cell) | 0); let a = grid.get(k); if (!a) grid.set(k, a = []); a.push(i); });
      let cnt = 0; ctx.strokeStyle = TK.accent || TK.oil; ctx.globalAlpha = .95; ctx.setLineDash([3, 3]); ctx.lineWidth = 2.2; ctx.beginPath();
      pts.forEach((p, i) => { const gx = (p[0] / cell) | 0, gy = (p[1] / cell) | 0; for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) { const arr = grid.get((gx + ox) + "," + (gy + oy)); if (!arr) continue; for (const j of arr) { if (j <= i) continue; const qq = pts[j]; if (qq[2] === p[2]) continue; const dx = qq[0] - p[0], dy = qq[1] - p[1]; if (dx * dx + dy * dy < 225) { cnt++; ctx.moveTo(p[0], p[1]); ctx.lineTo(qq[0], qq[1]); } } } });
      ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
      const now = 2 * cnt / chains.length; cpm = cpm == null ? now : cpm + (now - cpm) * Math.min(1, dt * 1.2);
      chains.forEach(c => { ctx.strokeStyle = TK.ink; ctx.fillStyle = TK.ink; ctx.globalAlpha = .8; ctx.lineWidth = 1.6; ctx.beginPath(); c.p.forEach((p, j) => j ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); c.p.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], 3.4, 0, 7); ctx.fill(); }); ctx.globalAlpha = 1; });
      if (ball) {
        const v = 200 / (1 + 0.35 * cpm); ball.y += v * dt; ball.t += dt;
        const bx = W / 2, gr = ctx.createRadialGradient(bx - 4, ball.y - 5, 2, bx, ball.y, 15);
        gr.addColorStop(0, "#FFFFFF"); gr.addColorStop(.45, "#A4AEB6"); gr.addColorStop(1, "#39424A");
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(bx, ball.y, 14, 0, 7); ctx.fill();
        if (ball.y > H - 14) { set("lens-times", { ...get("lens-times", {}), [n]: Math.round(ball.t * 10) / 10 }); ball = null; show(); }
      }
      acc += dt; if (acc > .3) { acc = 0; show(); }
    });
  });
  return `<div class="sim" id="${id}"><div class="sim-head"><strong>Teilchen-Lupe: in der Flüssigkeit</strong><button type="button" class="btn ghost sm" data-help>${ic("help", 18)} So geht’s</button></div>
    <div class="sim-stage"><canvas role="img" aria-label="Modell: Alkan-Ketten mit Van-der-Waals-Kontakten, eine Kugel sinkt hindurch"></canvas></div>
    <div class="legend"><span><span class="dot" style="background:var(--ink)"></span>C-Atom (H-Atome nicht gezeigt)</span><span>┄ Van-der-Waals-Kontakt</span></div>
    <div class="sim-ctrl">
      <div class="ctrl"><span class="nr">1</span><div class="grow"><p class="ctrl-label">Kettenlänge wählen</p><div class="chips" data-opts>${opts.map(o => `<button type="button" class="chip" data-n="${o.n}" aria-pressed="${o.n === n0}">${o.l}</button>`).join("")}</div></div></div>
      <div class="ctrl"><span class="nr">2</span><div class="grow stack"><div><button type="button" class="btn" data-drop>Kugel fallen lassen</button></div><div class="readout" data-out aria-live="off"></div></div></div>
    </div></div>`;

  const sp = 17, x0 = 112, rh = 48; let s = "";
  rows.forEach((r, i) => {
    const y = 30 + i * rh, pts = [];
    for (let j = 0; j < r.n; j++) pts.push([x0 + j * sp, r.n > 1 ? y + (j % 2 ? 6 : -6) : y]);
    let hs = "";

      let H = r.n === 1 ? [[p[0] - 14, p[1] - 11], [p[0] + 14, p[1] - 11], [p[0] - 14, p[1] + 11], [p[0] + 14, p[1] + 11]] : [[p[0], p[1] - 15], [p[0], p[1] + 15]];
      if (r.n > 1 && j === 0) H.push([p[0] - 15, p[1]]); if (r.n > 1 && j === r.n - 1) H.push([p[0] + 15, p[1]]);

      `<text x="0" y="${y + 5}" class="s-f">${r.f}</text><text x="${x0 + 15 * sp + 34}" y="${y + 5}" class="s-t">${r.t}</text>`;
  });

}

function MischSim() {
  const id = uid();
  onMount(() => {
    const root = document.getElementById(id); if (!root) return;
    const grid = $("[data-grid]", root), btn = $("[data-shake]", root), rst = $("[data-reset]", root), status = $("[data-status]", root);
    let st = get("misch-done") ? "done" : "start", timers = [];
    const clear = () => { timers.forEach(clearTimeout); timers = []; };
    onLeave(clear);
    const layers = m => {
      const top = topOf(m), bot = top === m.a ? m.b : m.a;
      if (st === "start" || (st === "done" && !m.mix))
        return `<div class="layer" style="bottom:0;height:40%;background:${LIQ[bot].c}"></div><div class="layer" style="bottom:40%;height:40%;background:${LIQ[top].c}"></div><div class="meniscus" style="bottom:40%"></div>`;
      if (st === "done") return `<div class="layer" style="bottom:0;height:80%;background:${mixCol(m)}"></div>`;
      const drops = m.mix ? "" : Array.from({ length: 18 }, (_, i) => { const s = 5 + (i % 4) * 2; return `<span class="drop" style="left:${(i * 37) % 78 + 6}%;bottom:${(i * 53) % 68 + 6}%;width:${s}px;height:${s}px;background:${LIQ[top].c}"></span>`; }).join("");
      return `<div class="layer" style="bottom:0;height:80%;background:${m.mix ? mixCol(m) : LIQ[bot].c}"></div>${drops}`;
    };
    const draw = () => {
      grid.innerHTML = MIX.map(m => `<div class="tube-col"><div class="mix-lbl"><b>${m.a}</b><span>+ ${m.b}</span></div><div class="mtube ${st === "shaking" ? "shake" : ""} ${st === "settling" ? "settle" : ""}">${layers(m)}</div><div class="mix-res">${st === "done" ? (m.mix ? "eine Phase" : "zwei Phasen") : "&nbsp;"}</div></div>`).join("");
      btn.disabled = st === "shaking" || st === "settling";
      status.textContent = st === "start" ? "Die Stoffe sind vorsichtig übereinander geschichtet. Erst beim Schütteln zeigt sich, ob sie sich mischen." : st === "shaking" ? "Schütteln …" : st === "settling" ? "Stehen lassen …" : "Welche Gemische bilden wieder zwei Phasen?";
    };
    btn.addEventListener("click", () => {
      clear(); st = "shaking"; draw();
      timers.push(setTimeout(() => { st = "settling"; draw(); }, 1100));
      timers.push(setTimeout(() => { st = "done"; set("misch-done", true); draw(); }, 3000));
    });
    rst.addEventListener("click", () => { clear(); st = "start"; draw(); });
    draw();
  });
  return `<div class="sim" id="${id}"><div class="sim-head"><strong>Mischversuch</strong><span class="small muted">Wasser ist zur besseren Sicht blau gefärbt.</span></div>
    <div class="sim-stage"><div class="visco" data-grid></div></div>
    <div class="sim-ctrl"><div class="ctrl"><span class="nr">1</span><div class="grow stack"><div class="row"><button type="button" class="btn" data-shake>Alle schütteln</button><button type="button" class="btn ghost sm" data-reset>Zurücksetzen</button></div><p class="status" data-status aria-live="polite"></p></div></div></div></div>`;
}
function MixCompare() {
  const rows = MIX.map(m => {
    const h = get("e4-hyp-" + m.k), ok = h ? (h === "ja") === m.mix : null;
    return `<li><b>${m.a} + ${m.b}:</b> ${m.mix ? "mischen sich – eine Phase" : `mischen sich nicht – zwei Phasen, ${topOf(m)} oben`} · ${ok == null ? '<span class="muted">keine Hypothese</span>' : ok ? '<span class="yes">Hypothese passt</span>' : '<span class="no">Hypothese weicht ab</span>'}</li>`;
  }).join("");
  return `<div class="card"><h3>Beobachtung und Hypothese</h3><ul class="cmp">${rows}</ul><p class="small muted">Oben schwimmt jeweils der Stoff mit der geringeren Dichte: Hexan 0,66 g/cm³, Speiseöl ca. 0,92 g/cm³, Wasser 1,00 g/cm³.</p><p>Auffällig: Speiseöl verhält sich wie ein Alkan – es mischt sich nicht mit Wasser, aber gut mit Hexan.</p></div>`;
}

function LoesLens() {
  const id = uid(), pairs = [{ k: "w", l: "Hexan + Wasser" }, { k: "p", l: "Hexan + Paraffinöl" }];
  const p0 = get("loes-pair", "w");
  onMount(() => {
    const root = document.getElementById(id); if (!root) return;
    const cv = $("canvas", root), stage = $(".sim-stage", root), out = $("[data-out]", root), status = $("[data-status]", root), shakeBtn = $("[data-shake]", root);
    let G = setupCanvas(cv, 300), pair = get("loes-pair", "w"), parts = [], phase = "start", hb = 0, hbF = null, acc = 0, timers = [];
    const FF = getComputedStyle(document.body).fontFamily;
    const R = Math.random;
    const clear = () => { timers.forEach(clearTimeout); timers = []; };
    onLeave(clear);
    const region = t => {
      const W = G.w, H = G.h;
      if (phase === "shake" || (phase === "settle" && pair === "p")) return [14, W - 14, 16, H - 14];
      return (t === "w" || t === "p") ? [14, W - 14, H * 0.54, H - 14] : [14, W - 14, 16, H * 0.42];
    };
    const retarget = () => parts.forEach(q => { const [x0, x1, y0, y1] = region(q.t); q.tx = x0 + R() * (x1 - x0); q.ty = y0 + R() * (y1 - y0); });
    const say = () => {
      const msg = {
        start: pair === "w" ? "Wasser (unten) und Hexan (oben) liegen getrennt. Schüttle das Gemisch." : "Paraffinöl (unten) und Hexan (oben) sind vorsichtig geschichtet. Schüttle das Gemisch.",
        shake: "Beim Schütteln werden die Moleküle durcheinandergewirbelt." + (pair === "w" ? " Viele Wasserstoffbrücken reißen." : ""),
        settle: pair === "w" ? "Die Wasser-Moleküle ziehen sich über Wasserstoffbrücken gegenseitig an und finden wieder zusammen. Die Hexan-Moleküle werden verdrängt: zwei Phasen." : "Zwischen allen Molekülen wirken ähnliche Van-der-Waals-Kräfte. Nichts drängt sie auseinander: Es bleibt eine Phase."
      }[phase];
      status.textContent = msg;
    };
    const init = () => {
      clear(); parts = []; phase = "start";
      const A = G.w * G.h;
      if (pair === "w") { for (let i = 0; i < Math.round(A / 2600); i++) parts.push({ t: "w" }); for (let i = 0; i < Math.round(A / 15000); i++) parts.push({ t: "h" }); }
      else { for (let i = 0; i < Math.round(A / 9000); i++) parts.push({ t: "h" }); for (let i = 0; i < Math.round(A / 16000); i++) parts.push({ t: "p" }); }
      retarget(); parts.forEach(q => { q.x = q.tx; q.y = q.ty; q.a = R() * 6.28; });
      say();
    };
    const show = () => { out.innerHTML = pair === "w" ? `<span>Wasserstoffbrücken im Bild: <b>${hb}</b></span><span>Zustand: <b>${phase === "shake" ? "vermischt" : "zwei Phasen"}</b></span>` : `<span>Zustand: <b>${phase === "start" ? "geschichtet" : "eine Phase"}</b></span>`; };
    $("[data-pairs]", root).addEventListener("click", e => { const b = e.target.closest("[data-p]"); if (!b) return; pair = b.dataset.p; set("loes-pair", pair); $$("[data-p]", root).forEach(x => x.setAttribute("aria-pressed", String(x.dataset.p === pair))); init(); show(); });
    shakeBtn.addEventListener("click", () => {
      clear(); phase = "shake"; retarget(); say();
      timers.push(setTimeout(() => { phase = "settle"; retarget(); say(); set("loes-shaken-" + pair, true); }, 2200));
    });
    $("[data-help]", root).addEventListener("click", () => coach([
      { el: $("[data-pairs]", root), text: "Wähle das Gemisch: Hexan mit Wasser oder Hexan mit Paraffinöl." },
      { el: shakeBtn, text: "Schüttle das Gemisch und beobachte, was danach mit den Molekülen passiert." },
      { el: cv, text: "Rot-weiß sind Wasser-Moleküle, die dunklen Ketten Alkane. Blau gestrichelt: Wasserstoffbrücken zwischen Wasser-Molekülen." }
    ]));
    onResize(stage, () => { G = setupCanvas(cv, 300); init(); });
    init(); show();
    loop(dt => {
      const ctx = G.ctx, W = G.w, H = G.h, k = phase === "shake" ? 6 : 1.2, jit = phase === "shake" ? 2.5 : .8;
      ctx.clearRect(0, 0, W, H);
      if (phase !== "shake" && !(phase === "settle" && pair === "p")) { ctx.strokeStyle = TK["line-strong"]; ctx.setLineDash([6, 6]); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(8, H * 0.48); ctx.lineTo(W - 8, H * 0.48); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = TK.muted; ctx.font = "600 11px " + FF; ctx.fillText("Phasengrenze", 12, H * 0.48 - 5); }
      parts.forEach(q => {
        if (R() < dt * 0.6) { const [x0, x1, y0, y1] = region(q.t); q.tx = clamp(q.tx + (R() - .5) * 40, x0, x1); q.ty = clamp(q.ty + (R() - .5) * 30, y0, y1); }
        q.x += (q.tx - q.x) * Math.min(1, dt * k) + (R() - .5) * jit; q.y += (q.ty - q.y) * Math.min(1, dt * k) + (R() - .5) * jit; q.a += (R() - .5) * dt * 3;
      });
      const ws = parts.filter(q => q.t === "w");
      let n = 0; ctx.strokeStyle = TK.cu; ctx.lineWidth = 1.9; ctx.globalAlpha = .9; ctx.setLineDash([4, 3]); ctx.beginPath();
      for (let i = 0; i < ws.length; i++) for (let j = i + 1; j < ws.length; j++) { const dx = ws[i].x - ws[j].x, dy = ws[i].y - ws[j].y; if (dx * dx + dy * dy < 22 * 22) { n++; ctx.moveTo(ws[i].x, ws[i].y); ctx.lineTo(ws[j].x, ws[j].y); } }
      ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
      parts.forEach(q => {
        if (q.t === "w") {
          [q.a + 0.95, q.a - 0.95].forEach(an => { ctx.fillStyle = "#F3F5F6"; ctx.strokeStyle = TK["line-strong"]; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(q.x + Math.cos(an) * 8, q.y + Math.sin(an) * 8, 3, 0, 7); ctx.fill(); ctx.stroke(); });
          ctx.fillStyle = "#D2362B"; ctx.beginPath(); ctx.arc(q.x, q.y, 5, 0, 7); ctx.fill();
        } else {
          const nb = q.t === "h" ? 6 : 12; drawChain(ctx, q.x, q.y, q.a, nb, 6.5, 3, q.t === "h" ? TK.ink : TK.oil, 0.9);
        }
      });
      hbF = hbF == null ? n : hbF + (n - hbF) * Math.min(1, dt * 3); hb = Math.round(hbF);
      acc += dt; if (acc > .3) { acc = 0; show(); }
    });
  });
  return `<div class="sim" id="${id}"><div class="sim-head"><strong>Teilchen-Lupe: Schütteln und Stehenlassen</strong><button type="button" class="btn ghost sm" data-help>${ic("help", 18)} So geht’s</button></div>
    <div class="sim-stage"><canvas role="img" aria-label="Modell: Wasser- und Alkan-Moleküle vor und nach dem Schütteln"></canvas></div>
    <div class="legend"><span><span class="dot" style="background:#D2362B"></span>O</span><span><span class="dot" style="background:#F3F5F6;border:1px solid var(--line-strong)"></span>H (Wasser)</span><span><span class="dot" style="background:var(--ink)"></span>Hexan</span><span><span class="dot" style="background:var(--oil)"></span>Paraffinöl</span><span style="color:var(--cu)">┄ Wasserstoffbrücke</span></div>
    <div class="sim-ctrl">
      <div class="ctrl"><span class="nr">1</span><div class="grow"><p class="ctrl-label">Gemisch wählen</p><div class="chips" data-pairs>${pairs.map(p => `<button type="button" class="chip" data-p="${p.k}" aria-pressed="${p.k === p0}">${p.l}</button>`).join("")}</div></div></div>
      <div class="ctrl"><span class="nr">2</span><div class="grow stack"><div><button type="button" class="btn" data-shake>Schütteln</button></div><p class="status" data-status aria-live="polite"></p><div class="readout" data-out></div></div></div>
    </div></div>`;
}

      (s.done ? "" : `<div class="row"><button type="button" class="btn" data-check ${s.sel != null && (s.conf || s.tries > 0) ? "" : "disabled"}>Antwort prüfen</button>${s.tries === 0 && !s.conf ? `<span class="small muted">Wähle eine Antwort und gib an, wie sicher du bist.</span>` : ""}</div>`) + `<div aria-live="polite">${fb}</div>`;

    return `<article class="et-card" data-c="${e}"><span class="et-num">${E.label}</span><h2>${E.title}</h2><p>${E.q}</p><p class="et-meta">${E.time} · ${E.steps.length} Schritte · ${Math.round(p * 100)} % erledigt</p><div class="meter"><i style="width:${p * 100}%"></i></div>${BadgeList(e)}<div><button type="button" class="btn ${e === "e3" ? "ghost" : ""}" data-go="${e}">${started ? `Weiter bei Schritt ${S.pos[e] + 1}` : e === "e3" ? "Freiwillig starten" : "Starten"} ${ic("right", 18)}</button></div></article>`;
  };
  return `<div class="home wrap wide">
    <section class="hero"><p class="eyebrow">Chemie · Einführungsphase · Organische Stoffklassen</p><h1><span class="w1">Brennt.</span> <span class="w2">Rußt.</span> <span class="w3">Fließt.</span></h1>
    <p class="lead">Benzin, Kerzenwachs und Kettenöl bestehen zu einem großen Teil aus Alkanen. Trotzdem verhalten sie sich völlig verschieden – und keins davon mischt sich mit Wasser. In einer Stunde findest du selbst heraus, woran das liegt.</p>${ChainStrip()}</section>
    <section class="stack"><h2 style="font-size:1.3rem">Dein Zeitplan für 60 Minuten</h2>
      <div class="timeline" role="img" aria-label="Zeitplan: Teil A etwa 30 Minuten, Teil B etwa 14 Minuten, Teil C mit Abschluss etwa 12 Minuten, 4 Minuten Puffer"><span class="tl-a" style="flex:30">Teil A · 30 min</span><span class="tl-b" style="flex:14">Teil B · 14 min</span><span class="tl-c" style="flex:12">Teil C · 12 min</span><span class="tl-p" style="flex:4" title="Puffer"></span></div>
      <p class="small muted">Jeder Schritt zeigt dir oben, wie viel Zeit du ungefähr brauchst. Die Vertiefung ist freiwillig – für Schnelle oder als Hausaufgabe.</p></section>
    <section class="etappen" aria-label="Teile der Lerneinheit">${["e1", "e2", "e4", "e3"].map(card).join("")}</section>
    <section class="card"><h2 style="font-size:1.3rem">So arbeitest du mit der Lerneinheit</h2><div class="rules">
      <div class="rule"><b>Eine Aufgabe pro Seite</b><span>Mit „Weiter“ unten geht es voran. Über „Schritt 3 von 6“ springst du frei zwischen den Schritten. Die Zeitangabe hilft dir beim Einteilen.</span></div>
      <div class="rule"><b>Hypothesen zählen nicht</b><span>Leg dich fest, bevor du beobachtest. Überraschungen bringen dich weiter – falsch liegen ist erlaubt.</span></div>
      <div class="rule"><b>Lernhilfen Stufe für Stufe</b><span>Jede Hilfe hat einen Denkanstoß und eine Antwort. Hilfen zu nutzen ist klug, nicht schwach.</span></div>
      <div class="rule"><b>Meilensteine statt Punkte</b><span>Meilensteine markieren echte Lernschritte. Es gibt keine Punkte und keine Rangliste.</span></div>
      <div class="rule"><b>Deine eigene Sitzung</b><span>Deine Eingaben bleiben nur auf diesem Gerät. Niemand sonst kann sie sehen oder verändern. Teilst du dir das iPad, beende am Ende deine Sitzung im Lernprotokoll.</span></div>
    </div></section>
    <details class="teacher card"><summary>Hinweise für Lehrkräfte</summary><div class="stack small">
      <p><b>Einordnung.</b> Chemie in der Einführungsphase, Inhaltsfeld „Organische Stoffklassen“ (Kernlehrplan Sek II NRW, 2022). Die Einheit schließt an die Stunde „Van-der-Waals-Kräfte verstehen“ an (temporäre und induzierte Dipole, Siedetemperatur und Kettenlänge) und greift deren Klettverschluss-Bild in den Lernhilfen auf.</p>
      <ul>
        <li><b>Sachkompetenz:</b> intermolekulare Wechselwirkungen erläutern und darauf Eigenschaften und Verwendung organischer Stoffe zurückführen (S2, S13, E7) – hier Entzündbarkeit, Rußbildung, Viskosität und Löslichkeit (inhaltlicher Schwerpunkt „Eigenschaften ausgewählter Stoffklassen“) sowie Benzin, Kerzenwachs, Kettenöl und Waschbenzin.</li>
        <li><b>Erkenntnisgewinnung:</b> Hypothesen zu Struktur-Eigenschafts-Beziehungen aufstellen und experimentell prüfen (E3, E4) – Hypothesen vor Video, Messung und Mischversuch, Teilchen-Lupen, Fallkugel-Versuch, Nachweis der Verbrennungsprodukte.</li>
        <li><b>Bewertung:</b> Kriterien für Entscheidungen aus chemischer Perspektive identifizieren und gewichten (B14) – „Benzin auf den Grill?“ in der Vertiefung, gut als Hausaufgabe.</li>
      </ul>
      <p><b>Zeit.</b> Die Einheit ist für eine 60-Minuten-Stunde angelegt: Teil A „Feuer &amp; Flamme“ (ca. 30 min: Hypothese, Video, Teilchen-Lupe, Erläuterung, Nachweis, Gleichung und Ruß), Teil B „Zäh oder flüssig“ (ca. 14 min: Hypothese, Fallkugel-Versuch, Auswertung, Erklärkette) und Teil C „Löslich oder nicht?“ mit Abschluss (ca. 12 min: Mischversuch, Teilchen-Lupe, Deutung, Merksätze, Selbsteinschätzung). Als Puffer bleiben nur etwa 4 Minuten – wird es knapp, eignen sich die Merksätze (Auftrag 15) als Hausaufgabe. Jeder Schritt zeigt eine Zeitangabe zur Orientierung. Längere Schreibaufgaben gibt es nur eine (Auftrag 4); Ruß und Viskosität werden über Lückentext und Erklärkette gesichert. Zusatzangebote für Schnelle sind aufklappbar. Die Vertiefung (Kerzen-Labor, Bewertungsaufgabe, Alkan-Check mit 15 Fragen) ist freiwillig – für Schnelle, als Hausaufgabe oder für die Folgestunde.</p>
      <ul>
        <li><b>Kognitiver Konflikt als Einstieg</b> (Tankstelle vs. Kerze, Hypothese vor dem Video) nach Barke et al. (2018), Kap. 3.2.4.</li>
        <li><b>Forschend-entwickelnder Aufbau</b> nach Schmidkunz &amp; Lindemann (Barke et al., Kap. 4.5.1): Problem → Vermutung → Untersuchung → Deutung → Sicherung. Hypothesen werden nicht bewertet.</li>
        <li><b>Vernichtungskonzept</b> (Kap. 2.2.3/2.2.5) wird gezielt aufgegriffen: „Wo bleibt das Pentan?“ → Nachweis → Atombilanz.</li>
        <li><b>Makro – Submikro – Symbol</b> (Johnstone): Video → Teilchen-Lupe → Gleichungs-Werkstatt.</li>
        <li><b>Gamification nach der Selbstbestimmungstheorie:</b> Kompetenz (sofortige, aufgabenbezogene Rückmeldung, Vorher-nachher-Barometer), Autonomie (freie Navigation, Hilfen auf Abruf, Zusatzangebote), Eingebundenheit (Partner-Checks). Bewusst ohne Punkte und Ranglisten; Meilensteine nur für inhaltliche Lernschritte. Im Check kein Punktesammeln durch Raten: Sicherheitsangabe und Zweitversuch mit Denkanstoß.</li>
        <li><b>Gestufte Lernhilfen</b> nach Hänze (Impuls und Antwort getrennt, letzte Stufe = Komplettlösung). Die Nutzung erscheint im Lernprotokoll – gut für die Ergebnissicherung.</li>
        <li><b>Sitzungen und Datenschutz:</b> Jede Person arbeitet in einer eigenen Sitzung auf ihrem Gerät. Eingaben werden nur im Browser gespeichert, nicht übertragen und sind für niemanden sonst sichtbar; es gibt keine gemeinsamen Daten, keinen Chat und keine Rangliste. Wird ein iPad geteilt (z. B. iPad-Koffer), fragt die Einheit beim Öffnen in einem neuen Tab, ob eine neue Sitzung starten soll. Am Stundenende beenden die Lernenden ihre Sitzung im Lernprotokoll. Den Link am besten nur mit Leserechten teilen, damit niemand kommentieren kann.</li>
      </ul>
      <p><b>Modellgrenzen.</b> Die Simulationen sind Modelle: Dampfmengen und Fallzeiten sind qualitativ richtig, aber gestaucht dargestellt; im Teilchenmodell fehlen die H-Atome. Das lässt sich gut für eine kurze Modellkritik nutzen.</p>
    </div></details>
    <footer class="foot"><p>Video: „Brennbarkeit der Alkane“, auch auf YouTube: youtu.be/G2rhKQotyKk. Nutzung im Rahmen des eigenen Unterrichts.</p><p>Fachdidaktische Grundlage: Barke, Harsch, Kröger &amp; Marohn (2018): Chemiedidaktik kompakt, 3. Aufl., Springer Spektrum; Kriterienkatalog zu Gamification in chemiedidaktischen Lernanwendungen.</p></footer>
  </div>`;
}

/* ============ Lernprotokoll ============ */
function heftSections() {
  const nm = k => (OBS_ROWS.find(r => r.k === k) || VIS[k] || {}).name || k;
  const ign = v => (IGN_OPTS.find(o => o.v === v) || {}).label || "–";
  const cf = v => (CONF.find(c => c.v === v) || {}).label || "";
  const ok = k => !!(get(k) || {}).ok;
  const eqs = Object.entries(get("eq-solved", {})).map(([k, [a, b, c, d]]) => { const E = EQS.find(e => e.k === k); return `${a > 1 ? a + " " : ""}${fAlk(E.n, false)} + ${b} O₂ → ${c > 1 ? c + " " : ""}CO₂ + ${d > 1 ? d + " " : ""}H₂O`; }).join("\n");
  const vr = get("vis-res", {});
  const wachs = minIgnite(get("vapH-log", {}), "wachs");
  const quizDone = QUIZ.filter(q => (get("q-" + q.id) || {}).done);
  return [
    { t: "Teil A · Feuer & Flamme", items: [
      ["Hypothese: Entzündbarkeit", get("e1-pred", []).map(nm).join(" → ") + (get("e1-pred-conf") ? ` (${cf(get("e1-pred-conf"))})` : "")],
      ["Hypothese: stärkster Ruß", get("e1-pred-soot") ? nm(get("e1-pred-soot")) : ""],
      ["Beobachtung Reihe 1", OBS_ROWS.filter(r => get("e1-obs-" + r.k)).map(r => `${r.name}: ${ign(get("e1-obs-" + r.k))}`).join("\n")],
      ["Was mich überrascht hat", get("e1-surprise", "")],
      ["Regel aus der Teilchen-Lupe", ok("e1-rule") ? blanksText("e1-rule", RULE1) : ""],
      ["Meine Erläuterung: Entzündbarkeit", get("e1-exp", "")],
      ["Meine Vermutung: Wo bleibt das Pentan?", (WHERE_OPTS.find(o => o.v === get("e1-where")) || {}).t || ""],
      ["Nachweis", ok("e1-nw-q") ? "Kupfer(II)-sulfat wird blau → Wasser. Kalkwasser wird trüb → Kohlenstoffdioxid." : ""],
      ["Ausgeglichene Gleichungen", eqs],
      ["Begründung: Ruß", ok("e1-russ-lt") ? blanksText("e1-russ-lt", RUSS_LT) : ""],
      ["Genutzte Lernhilfen", `Erläuterung Entzündbarkeit: ${hintUse("e1-exp", 5)} · Gleichung: ${hintUse("e1-eq", 4)}`]
    ] },
    { t: "Teil B · Zäh oder flüssig", items: [
      ["Hypothese: Viskosität", get("e2-pred", []).map(nm).join(" → ")],
      ["Messwerte (Fallzeit im Modell)", Object.keys(VIS).filter(k => vr[k] != null).map(k => `${VIS[k].name}: ${dec(vr[k], 1)} s`).join("\n")],
      ["Je-desto-Regel", ok("e2-rule") ? blanksText("e2-rule", RULE2) : ""],
      ["Erklärkette", get("e2-kette-ok") ? KETTE.map(k => k.label).join(" → ") : ""]
    ] },
    { t: "Teil C · Löslich oder nicht?", items: [
      ["Hypothesen: Mischbarkeit", MIX.filter(m => get("e4-hyp-" + m.k)).map(m => `${m.a} + ${m.b}: ${get("e4-hyp-" + m.k) === "ja" ? "mischen sich" : "mischen sich nicht"}`).join("\n")],
      ["Beobachtung", get("misch-done") ? MIX.map(m => `${m.a} + ${m.b}: ${m.mix ? "eine Phase" : "zwei Phasen, " + topOf(m) + " oben"}`).join("\n") : ""],
      ["Deutung", ok("e4-loes-lt") ? blanksText("e4-loes-lt", LOES_LT) : ""],
      ["Merksätze", [["e1-m1", M1], ["e1-m2", M2], ["e1-russ-lt", RUSS_LT], ["e2-m5", M5], ["e4-m6", M6]].filter(([k]) => ok(k)).map(([k, p]) => blanksText(k, p)).join("\n")]
    ] },
    { t: "Vertiefung (freiwillig)", items: [
      ["Kerzenwachs brannte ab", wachs != null ? wachs + " °C" : ""],
      ["Kriterienvergleich", CRIT.filter(c => get(c.k)).map(c => `${c.name}: ${(CRIT_OPTS.find(o => o.v === get(c.k)) || {}).label}`).join("\n")],
      ["Wichtigstes Kriterium", (CRIT.find(c => c.k === get("e3-weight")) || {}).name || ""],
      ["Mein Urteil", get("e3-urteil", "")],
      ["Alkan-Check", quizDone.length ? `${quizDone.filter(q => get("q-" + q.id).first).length} von ${QUIZ.length} Fragen im ersten Versuch richtig (${quizDone.length} bearbeitet)` : ""]
    ] },
    { t: "Meilensteine", items: [["Erreicht", Object.keys(BADGES).filter(b => S.badges[b]).map(b => BADGES[b].name).join(", ")]] }
  ];
}
function Heft() {
  const secs = heftSections();
  const text = "Mein Lernprotokoll – Brennt, rußt, fließt\n\n" + secs.map(s => s.t + "\n" + s.items.map(([l, v]) => `${l}: ${stripTags(v) || "–"}`).join("\n")).join("\n\n");
  const id = uid();
  onMount(() => {
    const el = document.getElementById(id); if (!el) return;
    el.addEventListener("click", e => {
      if (e.target.closest("[data-copy]")) {
        const msg = el.querySelector("[data-copymsg]");
        const fallback = () => { const ta = el.querySelector("textarea"); ta.hidden = false; ta.focus(); ta.select(); msg.textContent = "Kopieren war nicht direkt möglich. Der Text ist markiert – kopiere ihn mit „Kopieren“."; };
        try { navigator.clipboard.writeText(text).then(() => { msg.textContent = "Kopiert! Du kannst den Text jetzt z. B. in OneNote einfügen."; }, fallback); } catch (err) { fallback(); }
      }
      if (e.target.closest("[data-reset]")) el.querySelector("[data-confirm]").hidden = false;
      if (e.target.closest("[data-no]")) el.querySelector("[data-confirm]").hidden = true;
      if (e.target.closest("[data-yes]")) { endSession(); toast(`<span class="medal">${ic("check", 20)}</span><span><b>Sitzung beendet</b><br>Alle Eingaben auf diesem Gerät sind gelöscht. Du kannst das iPad weitergeben.</span>`); go("home"); }
    });
  });
  return `<div class="wrap stack" id="${id}"><p class="eyebrow">Deine Ergebnisse</p><h2 class="step-title">Mein Lernprotokoll</h2>
    <p class="lead">Hier sammelt die Lerneinheit alles, was du eingegeben hast. Übertrage das Wichtigste in dein Heft oder kopiere den Text, zum Beispiel in dein OneNote-Notizbuch.</p>
    <div class="row"><button type="button" class="btn" data-copy>${ic("copy", 18)} Text kopieren</button><button type="button" class="btn ghost" data-go="home">${ic("home", 18)} Zur Übersicht</button></div><p class="small" data-copymsg aria-live="polite"></p>
    <textarea hidden readonly rows="8" aria-label="Lernprotokoll als Text">${esc(text)}</textarea>
    ${secs.map(s => `<section class="card heft-sec"><h3>${s.t}</h3><dl>${s.items.map(([l, v]) => `<div><dt>${l}</dt><dd>${v ? esc(stripTags(v)) : '<span class="empty">noch leer</span>'}</dd></div>`).join("")}</dl></section>`).join("")}
    <section class="card"><h3>Sitzung beenden</h3><p class="small">Teilst du dir das Gerät mit anderen? Kopiere zuerst dein Lernprotokoll oder übertrage es ins Heft. Beende dann deine Sitzung: Alle Eingaben auf diesem Gerät werden gelöscht, und die nächste Person startet ohne deine Antworten.</p><div><button type="button" class="btn ghost sm" data-reset>Sitzung beenden</button></div>
    <div data-confirm hidden class="fb bad"><p>Sitzung wirklich beenden? Alle Eingaben, Messwerte und Meilensteine auf diesem Gerät werden gelöscht. Das lässt sich nicht rückgängig machen.</p><div class="row" style="margin-top:8px"><button type="button" class="btn sm" data-yes>Ja, Sitzung beenden</button><button type="button" class="btn ghost sm" data-no>Abbrechen</button></div></div></section></div>`;
}

/* ============ Sitzungs-Abfrage bei geteiltem Gerät ============ */
function Gate() {
  const id = uid(), last = (S.meta || {}).last;
  const when = last ? new Date(last).toLocaleString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) + " Uhr" : "unbekannt";
  const pA = Math.round(etProgress("e1") * 100), pB = Math.round(etProgress("e2") * 100), pC = Math.round(etProgress("e4") * 100);
  onMount(() => {
    const el = document.getElementById(id); if (!el) return;
    el.addEventListener("click", e => {
      if (e.target.closest("[data-new]")) { endSession(); toast(`<span class="medal">${ic("check", 20)}</span><span><b>Neue Sitzung gestartet</b><br>Alles, was du jetzt eingibst, gehört nur zu deiner Sitzung.</span>`); go("home"); }
      else if (e.target.closest("[data-resume]")) { markTab(); go("home"); }
    });
  });
  return `<div class="wrap stack" id="${id}"><p class="eyebrow">Sitzung</p><h2 class="step-title">Neue Person an diesem Gerät?</h2>
    <p class="lead">Auf diesem Gerät ist schon eine Sitzung gespeichert.</p>
    <div class="card"><p>Zuletzt aktiv: <b>${when}</b><br>Teil A zu ${pA} %, Teil B zu ${pB} %, Teil C zu ${pC} % bearbeitet.</p></div>
    <div class="row"><button type="button" class="btn" data-new>Neue Sitzung starten</button><button type="button" class="btn ghost" data-resume>Das ist meine Sitzung – weitermachen</button></div>
    <p class="small muted">Eine neue Sitzung löscht die gespeicherten Eingaben auf diesem Gerät. So sieht niemand die Antworten einer anderen Person.</p></div>`;
}

/* ============ Navigation ============ */
let VIEW = "home";
const NEXT_PART = { e1: "e2", e2: "e4" };
function go(view, i) {
  if (view in ET && i !== undefined) S.pos[view] = clamp(i, 0, ET[view].steps.length - 1);
  VIEW = view in ET || view === "heft" ? view : "home";
  try { history.replaceState(null, "", VIEW === "home" ? location.pathname + location.search : "#" + VIEW); } catch (e) { }
  render();
}
function render() {
  document.body.dataset.etappe = VIEW in ET ? VIEW : "e1";
  readTokens();
  const main = $("#view"), bb = $("#bottombar");
  if (VIEW in ET) {
    if (!(S.pos[VIEW] >= 0)) S.pos[VIEW] = 0;
    const E = ET[VIEW], st = E.steps[S.pos[VIEW]];
    S.seen[st.id] = 1; persist();
    paint(main, () => `<article class="step wrap"><p class="eyebrow">${E.label} · ${st.kind}${st.min ? ` · ca. ${st.min} min` : ""}</p><h2 class="step-title">${st.title}</h2>${st.render()}</article>`);
    bb.hidden = false;
  } else { paint(main, VIEW === "heft" ? Heft : VIEW === "gate" ? Gate : Home); bb.hidden = true; }
  closeSheet();
  window.scrollTo(0, 0);
  refreshChrome();
}
function refreshChrome() {
  const tb = $("#tb-title"); if (!tb) return;
  if (VIEW in ET) {
    const E = ET[VIEW], i = S.pos[VIEW], st = E.steps[i], last = i === E.steps.length - 1;
    tb.innerHTML = `<small>${E.label} · ${E.title}</small><strong>${st.title}</strong>`;
    $("#tb-prog").style.width = (etProgress(VIEW) * 100) + "%";
    $("#bb-count").innerHTML = `${ic("list", 18)} Schritt ${i + 1} von ${E.steps.length}`;
    $("#bb-prev").disabled = i === 0;
    $("#bb-next").innerHTML = last ? (NEXT_PART[VIEW] ? `Weiter zu ${ET[NEXT_PART[VIEW]].label} ${ic("right", 18)}` : `Übersicht ${ic("home", 18)}`) : `Weiter ${ic("right", 18)}`;
  } else {
    tb.innerHTML = VIEW === "heft" ? `<small>Deine Ergebnisse</small><strong>Mein Lernprotokoll</strong>` : VIEW === "gate" ? `<small>Sitzung</small><strong>Neue Person an diesem Gerät?</strong>` : `<small>Chemie · Einführungsphase</small><strong>Brennt, rußt, fließt</strong>`;
    const all = ["e1", "e2", "e4"].map(etProgress);
    $("#tb-prog").style.width = (all.reduce((a, b) => a + b, 0) / 3 * 100) + "%";
  }
}
function openSheet() {
  if (!(VIEW in ET)) return;
  const E = ET[VIEW], sh = $("#sheet");
  sh.innerHTML = `<div class="sheet-back" data-close></div><div class="sheet" role="dialog" aria-label="Alle Schritte"><div class="sheet-in"><div class="row" style="justify-content:space-between"><h3>${E.label} · ${E.title}</h3><button type="button" class="btn ghost sm" data-close>Schließen</button></div><ol>${E.steps.map((s, i) => `<li><button type="button" class="si ${i === S.pos[VIEW] ? "cur" : ""}" data-jump="${i}"><span class="n">${i + 1}</span><span><span class="k">${s.kind}${s.min ? ` · ca. ${s.min} min` : ""}</span>${s.title}</span>${isDone(s) ? `<span class="d">${ic("check", 18)}</span>` : ""}</button></li>`).join("")}</ol></div></div>`;
  sh.hidden = false;
  const cur = sh.querySelector(".si.cur"); if (cur) cur.focus();
}
function closeSheet() { const sh = $("#sheet"); if (sh) { sh.hidden = true; sh.innerHTML = ""; } }

function init() {
  $("#tb-home").innerHTML = `${ic("home", 20)}<span class="hide-sm">Übersicht</span>`;
  $("#tb-heft").innerHTML = `${ic("book", 20)}<span class="hide-sm">Lernprotokoll</span>`;
  $("#bb-prev").innerHTML = `${ic("left", 18)}<span class="hide-sm">Zurück</span>`;
  $("#tb-home").onclick = () => { if (VIEW !== "gate") go("home"); };
  $("#tb-heft").onclick = () => { if (VIEW !== "gate") go("heft"); };
  $("#bb-prev").onclick = () => { if (VIEW in ET) go(VIEW, S.pos[VIEW] - 1); };
  $("#bb-next").onclick = () => {
    if (!(VIEW in ET)) return;
    const n = ET[VIEW].steps.length;
    if (S.pos[VIEW] < n - 1) go(VIEW, S.pos[VIEW] + 1);
    else if (NEXT_PART[VIEW]) go(NEXT_PART[VIEW], 0);
    else go("home");
  };
  $("#bb-count").onclick = openSheet;
  $("#sheet").addEventListener("click", e => { if (e.target.closest("[data-close]")) closeSheet(); const j = e.target.closest("[data-jump]"); if (j) go(VIEW, +j.dataset.jump); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
  document.addEventListener("click", e => {
    const g = e.target.closest("[data-go]");
    if (g) { const v = g.dataset.go; go(v, g.dataset.step !== undefined ? +g.dataset.step : undefined); return; }
    if (e.target.closest("[data-heft]")) go("heft");
  });
  const mq = window.matchMedia && matchMedia("(prefers-color-scheme: dark)");
  if (mq && mq.addEventListener) mq.addEventListener("change", readTokens);
  if (window.MutationObserver) new MutationObserver(readTokens).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  const h = (location.hash || "").slice(1);
  if (hasProgress() && !tabActive()) VIEW = "gate";
  else { markTab(); VIEW = h in ET || h === "heft" ? h : "home"; }
  render();
}
init();
</script>
